server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Archivos estáticos del frontend ya compilado
  location / {
    try_files $uri /index.html;
  }

  # Todo lo que vaya a /graphql se reenvía al contenedor "backend" por la red de Docker.
  # Dentro de Docker, los servicios se encuentran por su nombre ("backend").
  location /graphql {
    proxy_pass http://backend:4000/graphql;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
  }
}
